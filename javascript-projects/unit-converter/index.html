<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
      
        <div class="container"> 
            
            <section class="card"> 
                <div class="card-header">
                    <h2 class="card-title">Metric/Imperial Unit Conversion </h2>
                    <input id="input" type="number" class="card-input" min="0">
                    <button id="btn" class="card-btn">Convert </button>
                    
                </div>  
                    
                
                <div class="card-body">
                    <div class="card-result">
                        
                        <div class="result-item"> 
                            <h3>Length (Meter/Feet) </h3>
                            <p id="length"></p>
                        </div>
                        <div class="result-item"> 
                            <h3>Volume (Liters/Gallons)</h3>
                            <p id="volume"></p>
                        </div>
                        <div class="result-item">
                            <h3>Mass (Kilograms/Pounds)</h3>
                            <p id="mass"></p>
                        </div>
                    </div>
                </div>
            </section>
            
        </div>
        
        <script src="index.js"></script>
    </body>
</html>
